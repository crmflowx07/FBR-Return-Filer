name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: QA and build APK
        run: |
          gradle :app:lintDebug
          gradle :app:testDebugUnitTest
          gradle :app:assembleDebug

      - name: Publish direct APK in repository
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/FBR-Return-Filer-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/FBR-Return-Filer-latest.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest APK [skip ci]"
            git push origin main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
