plugins { id 'com.android.application' }
android {
    namespace 'com.muzamil.propertyreturnfiler'
    compileSdk 35
    defaultConfig { applicationId 'com.muzamil.fbrreturnfiler.v13'; minSdk 26; targetSdk 35; versionCode 13; versionName '13.0.0' }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
